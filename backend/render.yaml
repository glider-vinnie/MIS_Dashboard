services:
  - type: web
    name: ngo-mis-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: CSV_PATH
        value: "MIS_Program(MIS_Program) (1).csv"
      - key: PORT
        value: "10000"
